# CCGS project configuration — single source of truth for project settings.
# Schema: grep the `## <key>` section of .claude/docs/effects-map.md — do not open it entire.

schema_version: 1

framework:
  version: 1.1.3
  last_upgraded: 2026-10-12

project:
  name: 신 처용가
  genre: top-down action RPG (한국 설화 퇴마)
  stage: Systems Design

# 기본값. 바꾸려면 `/settings modes.rigor=...` 또는 이 파일을 직접 고친다.
modes:
  rigor: standard
  automation: guided

engine:
  name: Godot
  version: "4.4"
  language: gdscript
  rendering: GL Compatibility
  # 코드 루트: `src/`(Godot, project.godot) — ADR-0001. 옛 웹판은 `legacy-web/`.

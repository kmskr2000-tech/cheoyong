[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/manifest.json, assets/models/*.json"
exclude_filter=""
export_path="../build/godot-web/index.html"

[preset.0.options]

variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/head_include="<meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black\"><meta name=\"apple-mobile-web-app-title\" content=\"신 처용가\"><link rel=\"apple-touch-icon\" href=\"index.apple-touch-icon.png\">"
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=true
progressive_web_app/display=1
progressive_web_app/orientation=1
progressive_web_app/background_color=Color(0.04, 0.05, 0.1, 1)

[preset.1]

name="Android"
platform="Android"
runnable=true
export_filter="all_resources"
include_filter="assets/manifest.json, assets/models/*.json"
exclude_filter=""
export_path="../build/cheoyong.apk"

[preset.1.options]

gradle_build/use_gradle_build=false
package/signed=false
package/unique_name="com.cheoyong.game"
package/name="신 처용가"
version/code=1
version/name="1.0"
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
